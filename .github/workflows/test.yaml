name: Test App

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-nodejs-sample:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Simulate test failure for Broker fallback test
        run: |
          echo "::error::Intentional test failure: the build must remain blocked despite Broker fallback."
          exit 1